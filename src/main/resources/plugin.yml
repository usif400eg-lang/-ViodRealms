name: VoxelPanel
version: '2.0.0'
main: com.voxelpanel.VoxelPanel
api-version: '26.2'
description: Advanced waypoint and teleportation system for VoxelPanel
author: VoxelPanel Team
website: https://voxelpanel.io

commands:
  tpu:
    description: Open the waypoint menu or teleport to a waypoint
    usage: /tpu [waypoint name]
    permission: voxelpanel.use
  tpubook:
    description: Get a book listing all commands
    usage: /tpubook
    permission: voxelpanel.use
  waypoint:
    description: Manage private waypoints using commands
    usage: /waypoint <set|del|list|category|icon|share|public> [args]
    aliases: [waypointl, wp]
    permission: voxelpanel.use
  tpuadmin:
    description: Open the administrator menu
    usage: /tpuadmin
    permission: voxelpanel.admin
  compass:
    description: Toggle compass tracker
    usage: /compass <track|reset>
    permission: voxelpanel.use
  language:
    description: Change your language
    usage: /language [ar|en]
    permission: voxelpanel.use
    aliases: [lang]
  tpe:
    description: Request to teleport to another player
    usage: /tpe <player>
    permission: voxelpanel.use
  tpeaccept:
    description: Accept a pending teleport request
    usage: /tpeaccept
    permission: voxelpanel.use
  tpedeny:
    description: Deny a pending teleport request
    usage: /tpedeny
    permission: voxelpanel.use
  back:
    description: Return to your previous location
    usage: /back
    permission: voxelpanel.use
  shareaccept:
    description: Accept a pending waypoint share
    usage: /shareaccept
    permission: voxelpanel.use
  sharedeny:
    description: Deny a pending waypoint share
    usage: /sharedeny
    permission: voxelpanel.use

permissions:
  voxelpanel.use:
    description: Allows access to waypoint commands
    default: true
  voxelpanel.admin:
    description: Allows access to admin commands
    default: op
  voxelpanel.admin.view:
    description: Allows viewing other players' waypoints
    default: op
  voxelpanel.admin.teleport:
    description: Allows teleporting to other players' waypoints
    default: op
  voxelpanel.admin.rename:
    description: Allows renaming other players' waypoints
    default: op
  voxelpanel.admin.delete:
    description: Allows deleting other players' waypoints
    default: op
  voxelpanel.bypass.delay:
    description: Bypass teleport delay
    default: op
  voxelpanel.bypass.limit:
    description: Bypass waypoint limit
    default: op
