waypoints:
  max-per-player: 10
  max-name-length: 32
  max-per-category: 0
  categories:
    - MINE
    - BASE
    - FARM
    - OTHER
  default-icon: "ENDER_PEARL"

teleport:
  delay: 0
  cancel-on-move: false
  safe-teleport: true
  particle-effects: true
  countdown-title: true
  cooldown-seconds: 0

tpa:
  expiry-seconds: 60

share:
  expiry-seconds: 60

death-waypoints:
  enabled: true
  expiry-seconds: 300
  auto-delete-on-visit: true
  track-compass: true

compass:
  enabled: true
  update-interval: 20

language:
  default: ar

sounds:
  enabled: true
  menu-open: "BLOCK_NOTE_BLOCK_PLING"
  success: "ENTITY_PLAYER_LEVELUP"
  teleport: "ENTITY_ENDERMAN_TELEPORT"
  delete: "BLOCK_ANVIL_LAND"
  error: "ENTITY_VILLAGER_NO"
  confirm: "UI_BUTTON_CLICK"
  cancel: "BLOCK_NOTE_BLOCK_BASS"

gui:
  animated: true
  animation-interval: 2

# ============================================================
#  VoxelPanel connection
# ------------------------------------------------------------
#  RECOMMENDED onboarding (6 steps):
#   1. Create the server in VoxelPanel and copy the node token
#      it shows once.
#   2. Stop the Minecraft server.
#   3. Drop the VoxelPanel jar into the server's plugins/ folder.
#   4. Start the server once so plugins/VoxelPanel/config.yml is
#      generated, then stop it again.
#   5. Set web.url and web.token below.
#   6. Start the server. It registers itself automatically and
#      appears as online in the panel.
# ============================================================
web:
  # Base URL of the VoxelPanel backend (the address the panel reports
  # for itself). The Minecraft server must be able to reach it.
  url: "https://viodrealms-tpu-default-rtdb.firebaseio.com"
  # Node token issued by the panel when you create the server.
  # If the panel revokes it, the plugin safely disconnects.
  token: ""
  # Use the realtime websocket channel. Set to false only if a proxy
  # blocks upgrades; the plugin then falls back to slower REST batching.
  websocket: true
  # Validate the backend TLS certificate. Keep true unless you know why not.
  verify-tls: true

firebase:
  enabled: true
  service-account-file: "firebase-service-account.json"
  # How often (in seconds) the plugin pushes live data to the backend (near real-time).
  sync-interval-seconds: 3
  # Unique server id from the panel (leave blank to auto-generate on first run).
  server-id: ""
  # Config format version (set by the panel; used to detect outdated configs).
  config-version: 2
  # Heartbeat interval (seconds) — how often the plugin proves it's alive.
  heartbeat-seconds: 5

# File manager: which folders/extensions the dashboard may browse/edit.
files:
  enabled: true
  # Max size (KB) of a text file the dashboard may open/edit.
  max-edit-kb: 512
  # Only these extensions can be opened as text and edited.
  editable-extensions:
    - yml
    - yaml
    - properties
    - json
    - txt
    - conf
    - cfg
    - toml

# Hosting panel API for start/stop/restart (e.g. Pterodactyl).
# The plugin cannot start itself once stopped, so start/restart go through the panel API.
panel:
  enabled: false
  # Pterodactyl-style client API. Example: https://panel.example.com
  base-url: ""
  # Client API key (Account > API Credentials). Keep this secret.
  api-key: ""
  # The server identifier in the panel (short id shown in the panel URL).
  server-identifier: ""

# Backup options.
backup:
  # Port for the built-in download server (Direct Local Download option).
  # The host must allow inbound access to this port for the download link to work.
  download-port: 8765
  # Public host/IP the browser should use for download links. Leave blank to
  # auto-detect the server's local address (set this if behind NAT/hosting).
  public-host: ""
